name: chatbotapp
description: "AI Chatbot Flutter app."
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.6
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.1.2
  markdown: ^7.3.0
  material_ui: ^1.11.1
  mime: ^2.0.0
  path: ^1.9.1
  provider: ^6.1.2
  speech_to_text: ^7.5.0
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - path: assets/gemini_config.json
      transformers:
        - package: chatbotapp:gemini_env_asset
